id: A001
titulo: Consistência aritmética dos boletins presidenciais
versao: '0.1.0'
status: rascunho
pergunta: >-
  Os boletins de urna relativos ao cargo de Presidente da República nos dois
  turnos das eleições de 2018, 2022 e 2026 apresentam consistência entre
  suas quantidades de votos, comparecimento, abstenções e eleitores aptos,
  segundo os leiautes e as exceções aplicáveis a cada pleito?

natureza: auditoria_deterministica
escopo:
  cargo: Presidente da República
  anos: [2018, 2022, 2026]
  turnos: [1, 2]
  unidades_geograficas: 27 UFs e exterior (ZZ)
  granularidade: boletim de urna lógico / seção apurada

hipoteses:
  h0: >-
    Todos os boletins elegíveis satisfazem as identidades aritméticas
    aplicáveis, após tratamento formal das categorias de voto e exceções.
  h1: >-
    Pelo menos um boletim elegível apresenta divergência aritmética
    confirmada e não explicada pelas regras aplicáveis.

fontes:
  - Portal de Dados Abertos do TSE — arquivos ZIP de boletins de urna
  - Arquivos oficiais de checksum SHA-512 associados aos ZIPs
  - Leiautes e documentos de referência dos respectivos pleitos
  - Tabelas locais votos_bu, importacoes_bu, downloads, resources e verificacoes_hash_bu (quando disponíveis)

metodologia:
  populacao: >-
    Todos os boletins relativos à eleição presidencial que deveriam estar
    representados nos seis turnos, incluindo seções agregadas ou especiais
    conforme as regras oficiais.
  variaveis:
    - ano
    - turno
    - uf
    - municipio
    - zona
    - secao
    - urna
    - tipo_votavel
    - votos
    - aptos
    - comparecimento
    - abstencoes
    - dados_originais
    - resource_id
    - arquivo_csv
    - linha_csv
  procedimento: >-
    (1) Validar integridade criptográfica e importação por recurso.
    (2) Conferir os leiautes e inventariar tipos de urna e de voto por ano/turno.
    (3) Estabelecer a chave de boletim e identificar duplicidades e agregações.
    (4) Definir identidades aritméticas condicionais para cada caso elegível.
    (5) Executar testes sobre snapshot imutável, registrar todas as divergências
    e verificar os casos com os CSVs originais. (6) Confrontar a cobertura
    das seções com fontes oficiais independentes antes de concluir para o universo.
  salvaguardas:
    - Nenhuma conclusão sobre fraude é inferida automaticamente de uma divergência.
    - Não somar comparecimento uma vez por linha/candidato.
    - Não contar seções agregadas ou substituições como duplicidades sem exame.
    - Não confundir cobertura de ZIPs por UF com cobertura de seções.
    - Não assumir que toda categoria especial é um voto nominal, branco ou nulo.
    - Documentar regras por pleito e rodar fase exploratória antes da confirmatória.

criterios_decisao:
  sim: >-
    Cobertura do universo validada, todos os boletins elegíveis reconciliados
    e nenhum caso com divergência aritmética não explicada.
  nao: >-
    Existe ao menos uma divergência confirmada em boletim elegível,
    verificada contra o original e não explicada por categorias especiais,
    agregações, revisões, erros de importação ou regras do leiaute.
  inconclusivo: >-
    Cobertura insuficiente, regra de interpretação não confirmada,
    divergência sem verificação documental ou evidências incapazes de sustentar
    sim ou não para o universo definido.

restricoes_de_execucao:
  - Protocolo só poderá mudar para aprovado após revisão dos leiautes e critérios.
  - Não executar como estudo confirmatório antes de congelar as regras.
